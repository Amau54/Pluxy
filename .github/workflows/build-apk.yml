name: Verification et publication Android

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Construire et publier les artefacts signes ?'
        type: boolean
        default: false

concurrency:
  group: pluxy-${{ github.workflow }}-${{ github.ref }}
  # Une publication ne doit pas etre interrompue pendant le remplacement de l'alias.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Le controle et la compilation n'ont jamais besoin d'ecrire dans le depot.
permissions:
  contents: read

jobs:
  python:
    name: Serveur PC - tests et dependances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Refuser les cles et mots de passe de signature versionnes
        shell: bash
        run: |
          set -euo pipefail
          tracked_keys="$(git ls-files '*.jks' '*.keystore' '*.p12')"
          if [[ -n "$tracked_keys" ]]; then
            echo "Cle de signature interdite dans Git :" >&2
            printf '%s\n' "$tracked_keys" >&2
            exit 1
          fi
          if git grep -nE \
            '(storePassword|keyPassword)[[:space:]]*=[[:space:]]*"[^"]+"' \
            -- 'client/**/build.gradle.kts'; then
            echo "Mot de passe de signature litteral interdit dans Gradle." >&2
            exit 1
          fi

      - name: Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Installer les dependances
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          -r server/requirements.txt -r server/requirements-dev.txt

      - name: Vérifier la cohérence des versions
        run: python tools/sync_versions.py --check

      - name: Tests Python et simulation du soak HTTP
        run: python -m pytest -q server/tests tools/tests

      - name: Analyse statique Python
        run: python -m ruff check server/pluxy server/tests tools

      - name: Vérifier l'outil de test longue durée
        run: python -m py_compile tools/device_soak.py

      - name: Audit des dependances Python
        run: python -m pip_audit -r server/requirements.txt --strict

  apk:
    name: Android - APK rapides de controle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle et validation du wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: SDK Android 36
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-36' 'build-tools;36.0.0'
      - name: Preparer uniquement la signature ephemere des APK de controle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Construire une seule fois les APK debug
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --build-cache --console=plain --warning-mode=all
      - name: Preparer les APK provisoires
        run: |
          mkdir -p dist-apk
          cp client/app/build/outputs/apk/debug/app-debug.apk dist-apk/Pluxy-debug.apk
          echo 'APK de controle disponibles. Signature locale du runner : ne remplacent pas le canal dev-latest. Publication seulement apres tous les gates et re-signature stable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Conserver les APK du run par identifiant immuable
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pluxy-apk-controle-${{ github.sha }}
          path: dist-apk/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  android:
    name: Android - tests, lint et bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle et validation du wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: SDK Android 36
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-36' 'build-tools;36.0.0'

      - name: Tests, lint release et builds de controle
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest :serverapp:testDebugUnitTest \
            :receiver-core:testDebugUnitTest :receiver-dlna:testDebugUnitTest \
            :app:lintRelease :serverapp:lintRelease \
            :receiver-core:lintRelease :receiver-dlna:lintRelease :receiver-cast:lintRelease \
            :app:bundleRelease \
            --build-cache --console=plain --warning-mode=all

      - name: Preparer les artefacts de controle non publiables
        run: |
          mkdir -p dist-ci
          cp client/app/build/outputs/bundle/release/app-release.aab dist-ci/Pluxy-unsigned.aab

      - name: Publier les artefacts de controle
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pluxy-controle-${{ github.sha }}
          path: dist-ci/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  android-startup:
    name: Android 9 - demarrage et palettes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle et validation du wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Installer le SDK et Android 9
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' \
            'system-images;android-28;google_apis;x86_64'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Preparer la signature ephemere du test
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Tester le chargement des themes et le premier lancement
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/pluxy-startup-avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/pluxy-startup-android"
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n pluxy-startup-api28 -k 'system-images;android-28;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd pluxy-startup-api28 -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -memory 1536 > emulator-startup.log 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5554 emu kill || kill "$emulator_pid" || true' EXIT
          if ! timeout 180 adb -s emulator-5554 wait-for-device; then
            cat emulator-startup.log
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 120); do
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then cat emulator-startup.log; exit 1; fi
          chmod +x gradlew
          ANDROID_SERIAL=emulator-5554 ./gradlew :app:connectedDebugAndroidTest --console=plain --build-cache
      - name: Conserver les resultats de compatibilite
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android9-startup-${{ github.sha }}
          path: |
            client/app/build/reports/androidTests/
            client/app/build/outputs/androidTest-results/
            client/emulator-startup.log
          retention-days: 7

  dev-release:
    name: APK debug continus
    needs: [python, android, apk, android-startup]
    # Without these protected signing secrets, a hosted runner would generate a
    # different debug certificate and make Android reject an in-place update.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.event.inputs.publish_release != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pluxy-dev-latest
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Vérifier que les clés debug stables sont disponibles
        id: signing
        shell: bash
        env:
          PLAYER_JKS_BASE64: ${{ secrets.PLUXY_PLAYER_DEBUG_JKS_BASE64 }}
          PLAYER_STORE_PASSWORD: ${{ secrets.PLUXY_PLAYER_DEBUG_STORE_PASSWORD }}
          PLAYER_KEY_ALIAS: ${{ secrets.PLUXY_PLAYER_DEBUG_KEY_ALIAS }}
          PLAYER_KEY_PASSWORD: ${{ secrets.PLUXY_PLAYER_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in PLAYER_JKS_BASE64 PLAYER_STORE_PASSWORD PLAYER_KEY_ALIAS PLAYER_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo '::warning::Controles reussis, mais publication dev-latest ignoree : les 4 secrets de signature stable sont requis.'
              echo '### Publication non effectuee' >> "$GITHUB_STEP_SUMMARY"
              echo 'dev-latest reste sur son ancienne version. Configurer les cles compatibles existantes et ses 3 identifiants ; aucune nouvelle cle ne sera generee automatiquement.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurer Java 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android requis
        if: steps.signing.outputs.ready == 'true'
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'

      - name: Recuperer exactement les APK valides de ce run
        if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.apk.outputs.artifact_id }}
          path: dist-input
          merge-multiple: true

      - name: Charger les certificats stables des APK de test
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          PLAYER_JKS_BASE64: ${{ secrets.PLUXY_PLAYER_DEBUG_JKS_BASE64 }}
          PLAYER_STORE_PASSWORD: ${{ secrets.PLUXY_PLAYER_DEBUG_STORE_PASSWORD }}
          PLAYER_KEY_ALIAS: ${{ secrets.PLUXY_PLAYER_DEBUG_KEY_ALIAS }}
          PLAYER_KEY_PASSWORD: ${{ secrets.PLUXY_PLAYER_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            PLAYER_JKS_BASE64 PLAYER_STORE_PASSWORD PLAYER_KEY_ALIAS PLAYER_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "Secret debug manquant: $name" >&2; exit 1; }
          done
          printf '%s' "$PLAYER_JKS_BASE64" | base64 --decode > "$RUNNER_TEMP/pluxy-player-debug.jks"
          chmod 600 "$RUNNER_TEMP"/pluxy-*-debug.jks
          mkdir -p dist-dev
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/pluxy-player-debug.jks" --ks-key-alias "$PLAYER_KEY_ALIAS" \
            --ks-pass env:PLAYER_STORE_PASSWORD --key-pass env:PLAYER_KEY_PASSWORD \
            --out dist-dev/Pluxy-debug.apk dist-input/Pluxy-debug.apk
          PLAYER_CERT_SHA256="$(keytool -exportcert -keystore "$RUNNER_TEMP/pluxy-player-debug.jks" -storepass:env PLAYER_STORE_PASSWORD -alias "$PLAYER_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          export PLAYER_CERT_SHA256
          python tools/publish_apk.py manifest --directory dist-dev --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --commit "$GITHUB_SHA" --channel debug --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publier ou actualiser le canal debug permanent
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/publish_apk.py publish-debug --directory dist-dev --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --commit "$GITHUB_SHA" --tag "dev-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --notes-file docs/DEBUG_APK_NOTES.md
          echo "Canal dev-latest publie depuis le commit $GITHUB_SHA, certificats compatibles verifies, manifeste BUILD_INFO.json et sommes SHA-256 inclus." >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer les certificats de test
        if: always() && steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          for key in "$RUNNER_TEMP/pluxy-player-debug.jks"; do
            if [[ -f "$key" ]]; then shred -u "$key" 2>/dev/null || rm -f "$key"; fi
          done

  release:
    name: Artefacts signes Play Store et APK privees
    needs: [python, android, apk, android-startup]
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-release
    concurrency:
      group: pluxy-official-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuser une publication hors de main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Le checkout ne conserve volontairement aucun identifiant. Sur un dépôt
          # privé, le contrôle de la tête de main doit donc fournir le jeton seulement
          # à cette lecture, sans l'écrire dans la configuration Git.
          git fetch --no-tags \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            main:refs/remotes/origin/main
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_commit="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          if [[ "$release_commit" != "$main_commit" ]]; then
            echo "La revision a publier n'est pas la tete actuelle de main." >&2
            exit 1
          fi

      - name: Verifier version et absence de release avant la compilation signee
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          player_version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' client/app/build.gradle.kts)
          player_code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' client/app/build.gradle.kts)
          [[ "$player_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$player_code" -gt 0 ]]
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then [[ "$GITHUB_REF_NAME" == "v$player_version" ]]; fi
          export RELEASE_TAG="v$player_version"
          python -c 'import os; from tools.publish_apk import Publisher; p=Publisher(os.environ["GITHUB_REPOSITORY"]); p.require_main(os.environ["GITHUB_SHA"]); p.require_unused_tag(os.environ["RELEASE_TAG"], os.environ["GITHUB_SHA"])'
          echo "version=$player_version" >> "$GITHUB_OUTPUT"

      - name: JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Reutiliser le cache Gradle sans y publier les builds signes
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: SDK Android 36
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-36' 'build-tools;36.0.0'

      - name: Verifier et charger les cles d'envoi
        shell: bash
        env:
          PLAYER_JKS_BASE64: ${{ secrets.PLUXY_PLAYER_UPLOAD_JKS_BASE64 }}
          PLUXY_PLAYER_UPLOAD_STORE_PASSWORD: ${{ secrets.PLUXY_PLAYER_UPLOAD_STORE_PASSWORD }}
          PLUXY_PLAYER_UPLOAD_KEY_ALIAS: ${{ secrets.PLUXY_PLAYER_UPLOAD_KEY_ALIAS }}
          PLUXY_PLAYER_UPLOAD_KEY_PASSWORD: ${{ secrets.PLUXY_PLAYER_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            PLAYER_JKS_BASE64
            PLUXY_PLAYER_UPLOAD_STORE_PASSWORD
            PLUXY_PLAYER_UPLOAD_KEY_ALIAS
            PLUXY_PLAYER_UPLOAD_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Secret GitHub manquant: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$PLAYER_JKS_BASE64" | base64 --decode > "$RUNNER_TEMP/pluxy-player-upload.jks"
          chmod 600 "$RUNNER_TEMP"/*.jks
          {
            echo "PLUXY_PLAYER_UPLOAD_STORE_FILE=$RUNNER_TEMP/pluxy-player-upload.jks"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/pluxy-player-upload.jks" \
            -storepass:env PLUXY_PLAYER_UPLOAD_STORE_PASSWORD -alias "$PLUXY_PLAYER_UPLOAD_KEY_ALIAS" >/dev/null

      - name: Construire les AAB et APK release signees
        working-directory: client
        env:
          PLUXY_PLAYER_UPLOAD_STORE_PASSWORD: ${{ secrets.PLUXY_PLAYER_UPLOAD_STORE_PASSWORD }}
          PLUXY_PLAYER_UPLOAD_KEY_ALIAS: ${{ secrets.PLUXY_PLAYER_UPLOAD_KEY_ALIAS }}
          PLUXY_PLAYER_UPLOAD_KEY_PASSWORD: ${{ secrets.PLUXY_PLAYER_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :app:bundleRelease :app:assembleRelease \
            --build-cache --console=plain --warning-mode=all

      - name: Nommer et verifier les artefacts
        shell: bash
        env:
          PLAYER_VERSION: ${{ steps.version.outputs.version }}
          PLUXY_PLAYER_UPLOAD_STORE_PASSWORD: ${{ secrets.PLUXY_PLAYER_UPLOAD_STORE_PASSWORD }}
          PLUXY_PLAYER_UPLOAD_KEY_ALIAS: ${{ secrets.PLUXY_PLAYER_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          player_version="$PLAYER_VERSION"
          mkdir -p dist-release
          cp client/app/build/outputs/bundle/release/app-release.aab "dist-release/Pluxy-$player_version.aab"
          cp client/app/build/outputs/apk/release/app-release.apk "dist-release/Pluxy-$player_version.apk"
          mkdir -p dist-mapping
          cp client/app/build/outputs/mapping/release/mapping.txt \
            "dist-mapping/Pluxy-$player_version-mapping.txt"
          jarsigner -verify -strict -keystore "$PLUXY_PLAYER_UPLOAD_STORE_FILE" -storepass:env PLUXY_PLAYER_UPLOAD_STORE_PASSWORD \
            "dist-release/Pluxy-$player_version.aab" "$PLUXY_PLAYER_UPLOAD_KEY_ALIAS"
          PLAYER_CERT_SHA256="$(keytool -exportcert -keystore "$PLUXY_PLAYER_UPLOAD_STORE_FILE" -storepass:env PLUXY_PLAYER_UPLOAD_STORE_PASSWORD -alias "$PLUXY_PLAYER_UPLOAD_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          export PLAYER_CERT_SHA256
          python tools/publish_apk.py manifest --directory dist-release --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --commit "$GITHUB_SHA" --channel release --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Effacer les cles d'envoi du runner
        if: always()
        shell: bash
        run: |
          set +e
          ./client/gradlew --stop
          for key in "$RUNNER_TEMP/pluxy-player-upload.jks"; do
            if [[ -f "$key" ]]; then shred -u "$key" 2>/dev/null || rm -f "$key"; fi
          done

      - name: Conserver les tables de desobfuscation R8 hors de la release publique
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pluxy-r8-mapping-${{ steps.version.outputs.version }}
          path: dist-mapping/
          if-no-files-found: error
          retention-days: 90

      - name: Generer la nomenclature logicielle SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist-release/Pluxy-${{ steps.version.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generer et verifier les sommes SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; from tools.publish_apk import checksums; checksums(Path("dist-release"))'
          (cd dist-release && sha256sum --check SHA256SUMS.txt)

      - name: Publier la release GitHub sans ecraser une version existante
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python tools/publish_apk.py publish-release --directory dist-release --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --commit "$GITHUB_SHA" --tag "v$RELEASE_VERSION" --notes-file RELEASE_NOTES.md
