name: Verification du serveur PC Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: PC Windows - installation et lancement
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Installer les dependances
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          -r server/requirements.txt -r server/requirements-dev.txt
      - name: Tests Windows et bootstrap PowerShell 5.1 et 7
        run: python -m pytest -q server/tests tools/tests
      - name: Analyse statique Python
        run: python -m ruff check server/pluxy server/tests tools
      - name: Installer Python automatiquement sur le runner Windows jetable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'tools\PC-Launcher.ps1')
          # Force the missing-Python path only in this disposable CI machine.
          function Get-PCPythonCandidates { return @() }
          $server = Join-Path $env:GITHUB_WORKSPACE 'server'
          $runtime = Join-Path $env:LOCALAPPDATA 'Programs\Pluxy\Python314'
          if ((Test-Path -LiteralPath (Join-Path $runtime 'python.exe')) -or
              (Test-Path -LiteralPath (Join-Path $server '.venv'))) {
            throw 'Le test installation doit commencer sans runtime ni environnement Pluxy.'
          }
          $python = Initialize-PCEnvironment -ServerDirectory $server -RuntimeDirectory $runtime
          if (-not (Test-PCDependencies -Python $python -Requirements (Join-Path $server 'requirements.txt'))) {
            throw 'Les dependances du serveur PC restent incompletes apres installation.'
          }
          $version = Get-PCPythonInfo -Executable $python
          if ($null -eq $version -or $version.Minor -ne 14 -or $version.Micro -ne 8) {
            throw 'Le test doit utiliser le Python 3.14.8 automatiquement installe.'
          }
          $reused = Initialize-PCEnvironment -ServerDirectory $server -RuntimeDirectory $runtime
          if ($reused -ne $python) { throw 'Le deuxieme lancement ne reutilise pas le meme environnement.' }
          $version | ConvertTo-Json -Compress
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\Start-PC.ps1') -PrepareOnly
          if ($LASTEXITCODE -ne 0) { throw 'Le lanceur PC ne reconnait pas son installation prete.' }
